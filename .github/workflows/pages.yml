name: Publish production site redirect

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build redirect to the live order system
        run: python scripts/build_site_redirect.py
      - name: Verify internal and factory destinations
        run: node --test tests/test_site_redirect.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy production site redirect
        id: deployment
        uses: actions/deploy-pages@v4
